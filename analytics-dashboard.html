<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Analytics Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link rel="icon" href="Favicon.png" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f2f2;
    }

    header {
      background-color: #fff;
      color: #007acc;
      padding: 1.5rem;
      text-align: center;
      border-bottom: 2px solid #007acc;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #007acc;
    }

    header p {
      margin: 0.5rem 0 0;
      font-size: 1.2rem;
      color: #005f99;
    }

    nav {
      background-color: #e6f0fa;
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #ccc;
      position: relative;
    }

    nav a {
      color: #007acc;
      text-decoration: none;
      margin: 0 1rem;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #005f99;
      text-decoration: underline;
    }

    #darkModeToggle {
      position: absolute;
      top: 1rem;
      right: 2rem;
      padding: 0.4rem 0.8rem;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #darkModeToggle:hover {
      background-color: #005f99;
    }

    section {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    #controls {
      text-align: center;
      margin-bottom: 2rem;
    }

    #chart {
      width: 90%;
      max-width: 800px;
      margin: auto;
    }

    select {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #333;
      color: white;
      margin-top: 2rem;
    }

    /* Dark mode styles */
    .dark-mode {
      background-color: #1e1e1e;
      color: #eaeaea;
    }

    .dark-mode header {
      background-color: #2a2a2a;
      color: #66ccff;
      border-bottom: 2px solid #66ccff;
    }

    .dark-mode header h1,
    .dark-mode header p {
      color: #66ccff;
    }

    .dark-mode nav {
      background-color: #2a2a2a;
      border-bottom: 1px solid #444;
    }

    .dark-mode nav a {
      color: #66ccff;
    }

    .dark-mode nav a:hover {
      color: #99ddff;
    }

    .dark-mode section {
      background-color: #2e2e2e;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.05);
    }

    .dark-mode h2,
    .dark-mode label {
      color: #eaeaea;
    }

    .dark-mode input,
    .dark-mode textarea {
      background-color: #444;
      color: #fff;
      border: 1px solid #666;
    }

    .dark-mode button[type="submit"] {
      background-color: #66ccff;
      color: #1e1e1e;
    }

    .dark-mode button[type="submit"]:hover {
      background-color: #99ddff;
    }

    .dark-mode footer {
      background-color: #1a1a1a;
      color: #ccc;
    }
  </style>
</head>
<body>

  <header>
    <h1>Adam Nichols</h1>
    <p>IT Support | Project Management | Data Analytics</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="analytics_dashboard.html">Analytics Dashboard</a>
    <a href="contact.html">Contact</a>
    <button id="darkModeToggle">🌙 Dark Mode</button>
  </nav>

  <section>
    <h2>Sales Data Visualization</h2>

    <div id="controls">
      <label for="chartType">Select Chart Type:</label>
      <select id="chartType">
        <option value="line">Line Chart</option>
        <option value="bar">Bar Chart</option>
        <option value="pie">Pie Chart</option>
      </select>
    </div>

    <div id="chart"></div>
  </section>

  <footer>
    <p>&copy; 2025 Adam Nichols</p>
  </footer>

  <script>
    const data = [
      { date: '2024-01-01', revenue: 1200 },
      { date: '2024-01-02', revenue: 1500 },
      { date: '2024-01-03', revenue: 1700 },
      { date: '2024-01-04', revenue: 1600 },
      { date: '2024-01-05', revenue: 1800 }
    ];

    const dates = data.map(d => d.date);
    const revenues = data.map(d => d.revenue);

    const chartTypeSelect = document.getElementById('chartType');
    const chartDiv = document.getElementById('chart');

    function renderChart(type) {
      let trace, layout;

      if (type === 'pie') {
        trace = {
          type: 'pie',
          labels: dates,
          values: revenues,
          textinfo: 'label+percent',
          insidetextorientation: 'radial'
        };
        layout = { title: 'Revenue Breakdown by Date' };
      } else {
        trace = {
          x: dates,
          y: revenues,
          type: type,
          marker: { color: '#007acc' }
        };
        layout = {
          title: 'Revenue Over Time',
          xaxis: { title: 'Date' },
          yaxis: { title: 'Revenue ($)' }
        };
      }

      Plotly.newPlot(chartDiv, [trace], layout);
    }

    chartTypeSelect.addEventListener('change', (e) => {
      renderChart(e.target.value);
    });

    // Initial render
    renderChart('line');

    // Dark mode toggle functionality
    const darkModeToggle = document.getElementById('darkModeToggle');
    darkModeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      darkModeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    });
  </script>

</body>
</html>
